services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hungrezy
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgresql
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  app:
    build: .
    depends_on:
      - postgres
      - redis
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/postgres
      DB_USERNAME: postgres
      DB_PASSWORD: postgresql
      REDIS_HOST: redis
      JWT_SECRET: replace-with-a-strong-64-character-secret-before-real-deployments
    ports:
      - "8080:8080"

volumes:
  postgres-data:
