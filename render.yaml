services:
  - type: web
    name: hungrezy-java-backend
    runtime: java
    plan: free
    buildCommand: "mvn -DskipTests package"
    startCommand: "java -Dserver.port=$PORT -jar target/*.jar"
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        value: "6379"
      - key: REDIS_USERNAME
        value: default
      - key: REDIS_PASSWORD
        sync: false
      - key: REDIS_SSL
        value: "true"
      - key: JWT_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: JAVA_TOOL_OPTIONS
        value: "-Xss512k -Xmx400m"
